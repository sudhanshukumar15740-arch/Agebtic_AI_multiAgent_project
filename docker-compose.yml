services:
  agents:
    build:
      context: .
      dockerfile: AgentsExecution/Dockerfile
    environment:
      MCP_SERVER_URL: http://operations:8090/mcp/
      LLM_BASE_URL: ${LLM_BASE_URL:-ws://host.docker.internal:4000/v1}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      LINKS_POOL_SIZE: ${LINKS_POOL_SIZE:-4}
      LLM_LINK_MAX_AGE_S: ${LLM_LINK_MAX_AGE_S:-3000}
      AGENTS_WORKERS: ${AGENTS_WORKERS:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      operations:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6000/health', timeout=2)"]
      interval: 1h
      timeout: 30s
      retries: 10
      start_period: 15s

  operations:
    build:
      context: .
      dockerfile: Operations/Dockerfile
    environment:
      AGENTS_URL: http://agents:6000
      OPERATIONS_DB: /data/operations.db
      # FastMCP keeps Streamable HTTP sessions in process memory. Operations
      # must use one worker unless MCP session state is externalized.
      OPERATIONS_WORKERS: ${OPERATIONS_WORKERS:-2}
    volumes:
      - operations-data:/data
    init: true
    restart: unless-stopped
    ports:
      - "80:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=3)"]
      interval: 1h
      timeout: 30s
      retries: 10
      start_period: 15s

volumes:
  operations-data:
